conky.config = {
    output_backend = 'x11',
    own_window = true,
    own_window_class = 'conky-keybinds',
    own_window_title = 'HyprFrost Keybindings',
    own_window_type = 'normal',
    own_window_hints = 'undecorated,above,sticky,skip_taskbar,skip_pager',
    own_window_color = '#1A1B26',

    alignment = 'middle_right',
    gap_x = 22,
    gap_y = -18,
    minimum_width = 290,
    maximum_width = 320,
    border_width = 1,
    border_inner_margin = 16,
    border_outer_margin = 4,
    draw_borders = true,
    draw_outline = false,
    draw_shades = false,
    default_outline_color = '7aa2f7',

    use_xft = true,
    font = 'JetBrainsMono Nerd Font:size=9',
    text_alpha = 1.0,
    override_utf8_locale = true,
    double_buffer = true,
    update_interval = 30.0,
    uppercase = false,
    use_spacer = 'none',

    default_color = 'c0caf5',
    color1 = '7aa2f7',
    color2 = 'bb9af7',
    color3 = '7dcfff',
    color4 = '565f89',
};

conky.text = [[
${color1}  KEYBINDINGS${alignr}${color4}SUPER + K${color}
${color4}${hr 1}${color}
${execp cat "${XDG_CACHE_HOME:-$HOME/.cache}/conky-keybinds.txt" 2>/dev/null || /home/jacob/.local/bin/conky-keybinds-format --compact}
]];
